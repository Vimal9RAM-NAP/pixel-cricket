<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pixel Cricket v1 - Ultimate Arcade Edition</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    
    body {
      background-color: #0d0e15;
      color: #fff;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 10px;
      touch-action: none; /* Prevents mobile swipe-refresh and scrolling */
    }

    #game-container {
      position: relative;
      text-align: center;
      border: 4px solid #333;
      padding: 15px;
      background: #141622;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      max-width: 730px;
      width: 100%;
    }

    .header-title {
      margin: 0 0 10px 0;
      color: #00ffcc;
      font-size: 20px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    canvas {
      background: #222;
      border: 2px solid #00ffcc;
      width: 100%;
      height: auto;
      max-height: 400px;
      display: block;
      margin: 0 auto;
      touch-action: none;
    }

    /* Mobile Controls Styling */
    #mobile-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      margin-top: 15px;
      gap: 10px;
    }

    .control-group {
      display: flex;
      gap: 10px;
      flex: 1;
    }

    .touch-btn {
      background: #1e2238;
      color: #00ffcc;
      border: 2px solid #00ffcc;
      padding: 14px 10px;
      font-family: 'Courier New', monospace;
      font-weight: bold;
      font-size: 15px;
      border-radius: 8px;
      flex: 1;
      text-align: center;
      cursor: pointer;
      box-shadow: 0 4px 0 #009977;
      transition: transform 0.05s, background 0.05s;
    }

    .touch-btn:active, .touch-btn.active {
      transform: translateY(4px);
      box-shadow: none;
      background: #00ffcc;
      color: #000;
    }

    .power-btn {
      background: #3a0d25;
      color: #ff0055;
      border-color: #ff0055;
      box-shadow: 0 4px 0 #990033;
    }

    .power-btn:active, .power-btn.active {
      background: #ff0055;
      color: #fff;
    }

    #instructions {
      margin-top: 10px;
      font-size: 12px;
      color: #aaa;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <h1 class="header-title">Pixel Cricket v1</h1>
    
    <!-- Game Canvas -->
    <canvas id="gameCanvas" width="700" height="400"></canvas>

    <!-- On-Screen Mobile Touch Controls -->
    <div id="mobile-controls">
      <div class="control-group">
        <button id="btn-up" class="touch-btn">▲ Lofted</button>
        <button id="btn-down" class="touch-btn">▼ Grounded</button>
      </div>
      <button id="btn-power" class="touch-btn power-btn">⚡ POWER</button>
    </div>

    <div id="instructions">
      <strong>Desktop:</strong> Up/Down Arrows (Position Shot) | Space (Swing) | P (Power Shot)<br>
      <strong>Mobile:</strong> Tap buttons below or tap Canvas directly to swing!
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Game state tracking
    let keys = { ArrowUp: false, ArrowDown: false, KeyP: false };
    let gameState = {
      score: 0,
      balls: 0,
      shotType: 'NORMAL', // 'LOFTED', 'GROUNDED', 'POWER'
      powerGauge: 100,
      statusMsg: 'TAP CANVAS OR SWING TO PLAY'
    };

    // Batsman & Ball positions
    let batsman = { x: 580, y: 220, height: 40, width: 15 };
    let ball = { x: 100, y: 240, vx: 0, vy: 0, radius: 6, isPitched: false, active: false };

    // Initialize Game Loop
    function init() {
      resetBall();
      requestAnimationFrame(gameLoop);
    }

    function resetBall() {
      ball.x = 120;
      ball.y = 230;
      ball.vx = 4 + Math.random() * 3;
      ball.vy = (Math.random() - 0.5) * 1.5;
      ball.active = true;
    }

    function executeSwing() {
      if (!ball.active) {
        resetBall();
        return;
      }

      // Check distance for hit detection
      let dist = Math.abs(ball.x - batsman.x);
      if (dist < 40) {
        let runs = 0;
        if (gameState.shotType === 'LOFTED') {
          runs = Math.random() > 0.4 ? 6 : 0;
        } else if (gameState.shotType === 'GROUNDED') {
          runs = Math.random() > 0.2 ? 4 : 1;
        } else if (gameState.shotType === 'POWER') {
          runs = 6;
          gameState.powerGauge = 0;
        } else {
          runs = Math.floor(Math.random() * 4);
        }

        gameState.score += runs;
        gameState.balls += 1;
        gameState.statusMsg = runs > 0 ? `HIT! +${runs} RUNS` : 'DOT BALL!';
        ball.active = false;
        setTimeout(resetBall, 1200);
      } else {
        gameState.statusMsg = 'MISS!';
      }
    }

    // Input Handling (Keyboard)
    window.addEventListener('keydown', (e) => {
      if (e.code === 'ArrowUp') { keys.ArrowUp = true; gameState.shotType = 'LOFTED'; }
      if (e.code === 'ArrowDown') { keys.ArrowDown = true; gameState.shotType = 'GROUNDED'; }
      if (e.code === 'KeyP' && gameState.powerGauge >= 100) { gameState.shotType = 'POWER'; }
      if (e.code === 'Space') { executeSwing(); }
    });

    window.addEventListener('keyup', (e) => {
      if (e.code === 'ArrowUp') keys.ArrowUp = false;
      if (e.code === 'ArrowDown') keys.ArrowDown = false;
      if (!keys.ArrowUp && !keys.ArrowDown) gameState.shotType = 'NORMAL';
    });

    // Touch Event Binding for Buttons
    function bindTouchBtn(id, actionOn, actionOff) {
      const btn = document.getElementById(id);
      
      const handleStart = (e) => {
        e.preventDefault();
        btn.classList.add('active');
        actionOn();
      };
      
      const handleEnd = (e) => {
        e.preventDefault();
        btn.classList.remove('active');
        if (actionOff) actionOff();
      };

      btn.addEventListener('touchstart', handleStart);
      btn.addEventListener('touchend', handleEnd);
      btn.addEventListener('mousedown', handleStart);
      btn.addEventListener('mouseup', handleEnd);
    }

    bindTouchBtn('btn-up', 
      () => { gameState.shotType = 'LOFTED'; }, 
      () => { gameState.shotType = 'NORMAL'; }
    );

    bindTouchBtn('btn-down', 
      () => { gameState.shotType = 'GROUNDED'; }, 
      () => { gameState.shotType = 'NORMAL'; }
    );

    bindTouchBtn('btn-power', 
      () => { 
        if (gameState.powerGauge >= 100) {
          gameState.shotType = 'POWER'; 
          executeSwing();
        }
      }, 
      () => { gameState.shotType = 'NORMAL'; }
    );

    // Direct Canvas Tap to Swing
    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      executeSwing();
    });

    // Main Render Loop
    function update() {
      if (ball.active) {
        ball.x += ball.vx;
        ball.y += ball.vy;

        if (ball.x > canvas.width) {
          gameState.statusMsg = 'BOWLED / PASSED';
          ball.active = false;
          setTimeout(resetBall, 1200);
        }
      }

      // Slowly refill power meter
      if (gameState.powerGauge < 100) {
        gameState.powerGauge += 0.1;
      }
    }

    function render() {
      // Clear screen
      ctx.fillStyle = '#1a1c2b';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Pitch background
      ctx.fillStyle = '#d2b48c';
      ctx.fillRect(80, 200, 540, 70);

      // Crease lines
      ctx.fillStyle = '#fff';
      ctx.fillRect(140, 200, 4, 70);
      ctx.fillRect(560, 200, 4, 70);

      // Draw Stumps
      ctx.fillStyle = '#e67e22';
      ctx.fillRect(570, 185, 4, 30); // Batsman Stumps
      ctx.fillRect(130, 185, 4, 30); // Bowler Stumps

      // Draw Batsman
      ctx.fillStyle = gameState.shotType === 'POWER' ? '#ff0055' : '#00ffcc';
      ctx.fillRect(batsman.x, batsman.y - (keys.ArrowUp ? 15 : 0) + (keys.ArrowDown ? 10 : 0), batsman.width, batsman.height);

      // Draw Ball
      if (ball.active) {
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#ff3333';
        ctx.fill();
        ctx.closePath();
      }

      // HUD & Metrics
      ctx.fillStyle = '#ffffff';
      ctx.font = '14px Courier New';
      ctx.fillText(`SCORE: ${gameState.score} | BALLS: ${gameState.balls}`, 20, 30);
      ctx.fillText(`SHOT: ${gameState.shotType}`, 20, 50);
      ctx.fillText(`POWER: ${Math.floor(gameState.powerGauge)}%`, 20, 70);

      // Status Banner
      ctx.fillStyle = '#00ffcc';
      ctx.font = '16px Courier New';
      ctx.textAlign = 'center';
      ctx.fillText(gameState.statusMsg, canvas.width / 2, 360);
      ctx.textAlign = 'left';
    }

    function gameLoop() {
      update();
      render();
      requestAnimationFrame(gameLoop);
    }

    // Launch game
    init();
  </script>
</body>
</html>
