<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pixel Cricket v1 - Ultimate Arcade Edition</title>
  <style>
    :root {
      --bg-color: #0d0e15;
      --container-bg: #141622;
      --accent-cyan: #00ffcc;
      --accent-pink: #ff0055;
      --accent-yellow: #ffcc00;
      --text-color: #c5c6c7;
      --card-bg: #151a21;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 15px 10px;
      overflow: hidden; /* Prevents page scrolling on arrow keys */
    }

    #game-wrapper {
      background: var(--container-bg);
      border: 3px solid var(--accent-pink);
      box-shadow: 0 0 20px rgba(255, 0, 85, 0.3), inset 0 0 15px rgba(0, 255, 204, 0.15);
      padding: 15px;
      max-width: 920px;
      width: 100%;
      border-radius: 4px;
    }

    .main-header {
      text-align: center;
      color: var(--accent-cyan);
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 15px;
      text-shadow: 0 0 8px rgba(0, 255, 204, 0.6);
      letter-spacing: 2px;
    }

    .layout-grid {
      display: grid;
      grid-template-columns: 1fr 310px;
      gap: 15px;
    }

    @media (max-width: 768px) {
      body { overflow: auto; }
      .layout-grid { grid-template-columns: 1fr; }
    }

    .canvas-container {
      position: relative;
      background: #0d0e15;
      border: 2px solid #ffffff;
      box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.8);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    canvas {
      display: block;
      background: #2e7d32;
      max-width: 100%;
      height: auto;
    }

    /* Sidebar Panels */
    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .panel {
      background: var(--card-bg);
      border: 2px solid var(--accent-pink);
      box-shadow: 3px 3px 0px var(--accent-cyan);
      padding: 12px;
      border-radius: 2px;
    }

    .panel-title {
      color: var(--accent-pink);
      font-size: 11px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .panel-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255, 0, 85, 0.3);
    }

    .dash-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .dash-card {
      background: #0d0e15;
      border: 1px solid #2a2f45;
      padding: 8px;
      border-radius: 2px;
    }

    .dash-label {
      font-size: 9px;
      color: #888;
      text-transform: uppercase;
    }

    .dash-value {
      font-size: 16px;
      font-weight: bold;
      color: var(--accent-cyan);
      margin-top: 2px;
    }

    .dash-value.alt { color: var(--accent-cyan); }
    .dash-value.yellow { color: var(--accent-yellow); }

    .meter-container {
      height: 14px;
      background: #0d0e15;
      border: 1px solid var(--accent-cyan);
      padding: 2px;
      margin-top: 6px;
    }

    .meter-fill {
      height: 100%;
      width: 30%;
      background: linear-gradient(90deg, #ff0055, #ffcc00, #00ffcc);
      transition: width 0.1s linear;
    }

    .meter-subtext {
      font-size: 10px;
      color: #888;
      margin-top: 4px;
    }

    .controls-info {
      font-size: 10px;
      line-height: 1.6;
      color: #aaa;
    }

    .key-tag {
      display: inline-block;
      background: #10121a;
      border: 1px solid var(--accent-cyan);
      color: var(--accent-cyan);
      padding: 1px 4px;
      font-size: 9px;
      border-radius: 2px;
      margin: 0 2px;
    }

    .guide-btn {
      width: 100%;
      background: var(--accent-pink);
      color: #fff;
      border: none;
      padding: 8px;
      font-family: inherit;
      font-weight: bold;
      font-size: 11px;
      cursor: pointer;
      margin-top: 8px;
      box-shadow: 2px 2px 0px var(--accent-cyan);
    }

    /* Menu Overlay */
    .overlay-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(13, 14, 21, 0.92);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 12px;
      padding: 20px;
      text-align: center;
      z-index: 10;
    }

    .overlay-title {
      color: var(--accent-cyan);
      font-size: 24px;
      font-weight: bold;
      text-shadow: 0 0 10px rgba(0, 255, 204, 0.8);
    }

    .menu-btn {
      width: 200px;
      padding: 10px;
      background: #141622;
      color: var(--accent-cyan);
      border: 2px solid var(--accent-cyan);
      font-family: inherit;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 3px 3px 0px var(--accent-pink);
    }

    .menu-btn.primary {
      background: var(--accent-cyan);
      color: #0d0e15;
    }

    /* Mobile Controls Bar */
    #mobile-touch-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
      margin-top: 12px;
      padding: 10px;
      background: #0f111a;
      border: 2px solid var(--accent-pink);
      box-shadow: 3px 3px 0px var(--accent-cyan);
      border-radius: 4px;
    }

    .touch-row {
      display: flex;
      gap: 8px;
      width: 100%;
    }

    .cyber-btn {
      flex: 1;
      padding: 12px 4px;
      background: #141622;
      color: var(--accent-cyan);
      border: 1px solid var(--accent-cyan);
      font-family: 'Courier New', Courier, monospace;
      font-size: 11px;
      font-weight: bold;
      text-transform: uppercase;
      border-radius: 2px;
      cursor: pointer;
      box-shadow: 2px 2px 0px var(--accent-pink);
    }

    .cyber-btn:active {
      background: var(--accent-cyan);
      color: #0d0e15;
      transform: translate(2px, 2px);
      box-shadow: none;
    }

    .cyber-btn-action {
      background: #1e1326;
      color: var(--accent-pink);
      border-color: var(--accent-pink);
      box-shadow: 2px 2px 0px var(--accent-cyan);
    }

    .cyber-btn-action:active {
      background: var(--accent-pink);
      color: #ffffff;
      transform: translate(2px, 2px);
      box-shadow: none;
    }
  </style>
</head>
<body>

<div id="game-wrapper">
  <div class="main-header">🏏 PIXEL CRICKET V1</div>

  <div class="layout-grid">
    <!-- Pitch Canvas Display -->
    <div class="canvas-container">
      <canvas id="gameCanvas" width="380" height="520"></canvas>

      <!-- Menu Overlay -->
      <div id="menuOverlay" class="overlay-screen">
        <div class="overlay-title">PIXEL CRICKET</div>
        <div style="color: var(--accent-yellow); font-size: 11px;">v1.0 Ultimate Arcade Edition</div>
        <button class="menu-btn primary" onclick="startGame()">► START MATCH</button>
        <button class="menu-btn" onclick="toggleGuide()">? HOW TO PLAY</button>
      </div>
    </div>

    <!-- Sidebar Dashboard -->
    <div class="sidebar">
      <div class="panel">
        <div class="panel-title">📊 MATCH DASHBOARD</div>
        <div class="dash-grid">
          <div class="dash-card">
            <div class="dash-label">MODE</div>
            <div id="ui-mode" class="dash-value">SOLO</div>
          </div>
          <div class="dash-card">
            <div class="dash-label">TARGET</div>
            <div id="ui-target" class="dash-value alt">32</div>
          </div>
          <div class="dash-card">
            <div class="dash-label">SCORE</div>
            <div id="ui-score" class="dash-value yellow">6/0</div>
          </div>
          <div class="dash-card">
            <div class="dash-label">BALLS</div>
            <div id="ui-balls" class="dash-value">4</div>
          </div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-title">🌱 MATCH CONDITIONS</div>
        <div class="dash-grid">
          <div class="dash-card">
            <div class="dash-label">PITCH TYPE</div>
            <div id="ui-pitch" class="dash-value" style="font-size: 12px;">DUSTY</div>
          </div>
          <div class="dash-card">
            <div class="dash-label">BOWLER</div>
            <div id="ui-bowler" class="dash-value yellow" style="font-size: 12px;">SPINNER</div>
          </div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-title">⚡ POWER SHOT METER</div>
        <div class="meter-subtext">Fill meter to unlock <b>KEY 'P'</b></div>
        <div class="meter-container">
          <div id="ui-meter" class="meter-fill"></div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-title">🎮 QUICK CONTROLS</div>
        <div class="controls-info">
          <span class="key-tag">◀</span><span class="key-tag">▶</span> Move | 
          <span class="key-tag">▲</span> Loft | 
          <span class="key-tag">▼</span> Ground<br>
          <span class="key-tag">SPACE</span> Swing | 
          <span class="key-tag">P</span> Power Shot
        </div>
        <button class="guide-btn" onclick="toggleGuide()">? DETAILED GUIDE</button>
      </div>
    </div>
  </div>

  <!-- Mobile Touch Controls Bar -->
  <div id="mobile-touch-container">
    <div class="touch-row">
      <button class="cyber-btn" id="m-btn-left">◀ Move L</button>
      <button class="cyber-btn" id="m-btn-right">Move R ▶</button>
      <button class="cyber-btn" id="m-btn-loft">▲ Loft</button>
      <button class="cyber-btn" id="m-btn-ground">▼ Ground</button>
    </div>
    <div class="touch-row">
      <button class="cyber-btn cyber-btn-action" id="m-btn-swing" style="flex: 2;">🏏 SWING (SPACE)</button>
      <button class="cyber-btn cyber-btn-action" id="m-btn-power" style="flex: 1;">⚡ POWER (P)</button>
    </div>
  </div>
</div>

<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  // Web Audio Synthesizer
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function playSound(freq, duration, type='square') {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  }

  // Game States
  let isPlaying = false;
  let runsScored = 6;
  let wickets = 0;
  let ballsRemaining = 4;
  let targetRuns = 32;
  let powerMeter = 35;
  let shotType = 'NORMAL';
  let bannerText = "RUNS SCORED: 6";
  let popupCommentary = "";
  let popupTimer = 0;

  let keys = {};
  let batsman = { x: 140, y: 440, swingAnim: 0 };
  let bowler = { x: 180, y: 130, armAnim: 0 };
  let ball = { x: 190, y: 150, vx: 0, vy: 0, active: false };

  // Prevent Page Scroll when pressing Arrow Keys or Space
  window.addEventListener('keydown', (e) => {
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) {
      e.preventDefault();
    }
    keys[e.code] = true;

    if (e.code === 'ArrowUp') shotType = 'LOFT';
    if (e.code === 'ArrowDown') shotType = 'GROUND';
    if (e.code === 'KeyP' && powerMeter >= 100) shotType = 'POWER';
    if (e.code === 'Space') executeSwing();
  });

  window.addEventListener('keyup', (e) => {
    keys[e.code] = false;
    if (!keys['ArrowUp'] && !keys['ArrowDown']) shotType = 'NORMAL';
  });

  function startGame() {
    isPlaying = true;
    runsScored = 0;
    wickets = 0;
    ballsRemaining = 6;
    powerMeter = 30;
    bannerText = "MATCH STARTED!";
    document.getElementById('menuOverlay').style.display = 'none';
    updateUI();
    resetBall();
  }

  function updateUI() {
    document.getElementById('ui-score').innerText = `${runsScored}/${wickets}`;
    document.getElementById('ui-balls').innerText = ballsRemaining;
    document.getElementById('ui-target').innerText = targetRuns;
    document.getElementById('ui-meter').style.width = `${powerMeter}%`;
  }

  function resetBall() {
    ball.x = 185 + (Math.random() * 10 - 5);
    ball.y = 150;
    ball.vx = (Math.random() - 0.5) * 1.5;
    ball.vy = 3.5 + Math.random() * 1.5;
    ball.active = true;
    bowler.armAnim = 10;
  }

  function triggerPopup(text) {
    popupCommentary = text;
    popupTimer = 60;
  }

  function executeSwing() {
    if (!isPlaying || !ball.active) return;

    batsman.swingAnim = 12;
    let dist = Math.abs(ball.y - (batsman.y + 10));
    let alignment = Math.abs(ball.x - batsman.x);

    if (dist < 40 && alignment < 45) {
      playSound(520, 0.15, 'triangle'); // Bat contact sound
      let hitRuns = 0;

      if (shotType === 'LOFT') {
        hitRuns = Math.random() > 0.3 ? 6 : 0;
      } else if (shotType === 'GROUND') {
        hitRuns = Math.random() > 0.2 ? 4 : 2;
      } else if (shotType === 'POWER' && powerMeter >= 100) {
        hitRuns = 6;
        powerMeter = 0;
      } else {
        hitRuns = Math.floor(Math.random() * 4) + 1;
      }

      if (hitRuns === 6) triggerPopup("SIXER! OUT OF THE PARK!");
      else if (hitRuns === 4) triggerPopup("FOUR! BEAUTIFUL TIMING!");
      else triggerPopup(`${hitRuns} RUNS TAKEN!`);

      runsScored += hitRuns;
      bannerText = `RUNS SCORED: ${hitRuns}`;
      powerMeter = Math.min(100, powerMeter + 25);
      ball.active = false;
      ballsRemaining--;

      checkGameOver();
      updateUI();
      if (isPlaying) setTimeout(resetBall, 1200);
    } else {
      playSound(180, 0.2, 'sawtooth'); // Swing and miss sound
    }
  }

  function checkGameOver() {
    if (ballsRemaining <= 0 || runsScored >= targetRuns) {
      isPlaying = false;
      setTimeout(() => {
        if (runsScored >= targetRuns) playSound(880, 0.4, 'sine');
        alert(runsScored >= targetRuns ? '🎉 YOU WON THE MATCH!' : '❌ MATCH OVER');
        document.getElementById('menuOverlay').style.display = 'flex';
      }, 500);
    }
  }

  function update() {
    if (keys['ArrowLeft'] && batsman.x > 130) batsman.x -= 3;
    if (keys['ArrowRight'] && batsman.x < 220) batsman.x += 3;

    if (batsman.swingAnim > 0) batsman.swingAnim--;
    if (bowler.armAnim > 0) bowler.armAnim--;
    if (popupTimer > 0) popupTimer--;

    if (isPlaying && ball.active) {
      ball.x += ball.vx;
      ball.y += ball.vy;

      if (ball.y > 480) {
        playSound(120, 0.3, 'sawtooth'); // Bowled / Passed sound
        triggerPopup("BOWLED / PASSED!");
        bannerText = "DOT BALL / BOWLED";
        ball.active = false;
        ballsRemaining--;
        checkGameOver();
        updateUI();
        if (isPlaying) setTimeout(resetBall, 1200);
      }
    }
  }

  function drawPitch() {
    // Grass stripes
    ctx.fillStyle = '#266b2a';
    for (let i = 0; i < canvas.height; i += 40) {
      if ((i / 40) % 2 === 0) ctx.fillRect(0, i, canvas.width, 40);
    }

    // Dirt pitch
    ctx.fillStyle = '#d2b48c';
    ctx.fillRect(130, 80, 120, 380);

    // Crease lines
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(130, 150, 120, 4);
    ctx.fillRect(130, 420, 120, 4);

    // Stumps (Top & Bottom)
    ctx.fillStyle = '#ffffff';
    for (let i = 0; i < 3; i++) {
      ctx.fillRect(182 + i * 6, 136, 3, 14); // Bowler wickets
      ctx.fillRect(182 + i * 6, 424, 3, 14); // Batsman wickets
    }
  }

  function render() {
    drawPitch();

    // Bowler Sprite (Pink & Yellow Pixel Character)
    ctx.fillStyle = '#e0115f';
    ctx.fillRect(bowler.x, bowler.y - 20, 20, 14); // Head
    ctx.fillStyle = '#ffcc00';
    ctx.fillRect(bowler.x, bowler.y - 6, 20, 18); // Body
    ctx.fillStyle = '#e0115f';
    ctx.fillRect(bowler.x - (bowler.armAnim > 0 ? 6 : 0), bowler.y - 2, 6, 12); // Arm

    // Batsman Sprite (Blue Helmet & White Pads)
    ctx.fillStyle = '#1e88e5';
    ctx.fillRect(batsman.x, batsman.y - 20, 18, 16); // Helmet
    ctx.fillStyle = '#d81b60';
    ctx.fillRect(batsman.x + 2, batsman.y - 4, 14, 18); // Shirt
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(batsman.x, batsman.y + 14, 8, 16); // Left pad
    ctx.fillRect(batsman.x + 10, batsman.y + 14, 8, 16); // Right pad

    // Bat Sprite
    ctx.fillStyle = '#d2b48c';
    if (batsman.swingAnim > 0) {
      ctx.fillRect(batsman.x + 18, batsman.y - 10, 18, 6);
    } else {
      ctx.fillRect(batsman.x - 6, batsman.y, 6, 20);
    }

    // Ball Sprite
    if (ball.active) {
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, 5, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.fill();
      ctx.closePath();
    }

    // Top Banner Bar
    ctx.fillStyle = '#0f1710';
    ctx.fillRect(10, 20, 360, 32);
    ctx.fillStyle = '#00ffcc';
    ctx.font = 'bold 12px "Courier New"';
    ctx.textAlign = 'center';
    ctx.fillText(bannerText, 190, 40);

    // Floating Overlay Commentary Popup
    if (popupTimer > 0) {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
      ctx.fillRect(40, 240, 300, 40);
      ctx.strokeStyle = '#ffcc00';
      ctx.lineWidth = 2;
      ctx.strokeRect(40, 240, 300, 40);

      ctx.fillStyle = '#ffcc00';
      ctx.font = 'bold 14px "Courier New"';
      ctx.fillText(popupCommentary, 190, 265);
    }
  }

  // Virtual Key Binding for Mobile Controls
  function bindVirtualKey(elementId, keyCode, key, code) {
    const btn = document.getElementById(elementId);
    if (!btn) return;

    const triggerDown = (e) => {
      e.preventDefault();
      window.dispatchEvent(new KeyboardEvent('keydown', { key, code, keyCode, bubbles: true }));
    };

    const triggerUp = (e) => {
      e.preventDefault();
      window.dispatchEvent(new KeyboardEvent('keyup', { key, code, keyCode, bubbles: true }));
    };

    btn.addEventListener('touchstart', triggerDown, { passive: false });
    btn.addEventListener('touchend', triggerUp, { passive: false });
    btn.addEventListener('mousedown', triggerDown);
    btn.addEventListener('mouseup', triggerUp);
  }

  bindVirtualKey('m-btn-left', 37, 'ArrowLeft', 'ArrowLeft');
  bindVirtualKey('m-btn-right', 39, 'ArrowRight', 'ArrowRight');
  bindVirtualKey('m-btn-loft', 38, 'ArrowUp', 'ArrowUp');
  bindVirtualKey('m-btn-ground', 40, 'ArrowDown', 'ArrowDown');
  bindVirtualKey('m-btn-swing', 32, ' ', 'Space');
  bindVirtualKey('m-btn-power', 80, 'p', 'KeyP');

  function toggleGuide() {
    alert("CONTROLS:\n- Arrow Left/Right: Position Batsman\n- Arrow Up: Lofted Shot\n- Arrow Down: Grounded Shot\n- Spacebar: Swing Bat\n- P: Power Shot (When meter is full)");
  }

  function gameLoop() {
    update();
    render();
    requestAnimationFrame(gameLoop);
  }

  gameLoop();
</script>
</body>
</html>
